name: Aggiornamento Basket TV

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  pull_request:
    branches:
      - main

# La nuova revisione di una PR sostituisce il test precedente; main resta serializzato.
concurrency:
  group: basket-tv-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Verifica ramo senza pubblicare
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout del ramo da verificare
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installa dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Chromium Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      # Evita l’installazione automatica delle dipendenze di sistema via apt, che può bloccarsi sui mirror Ubuntu.
      # Le dipendenze Python vengono installate sopra; il browser ha un timeout dedicato.
      - name: Installa Chromium
        timeout-minutes: 5
        run: python -m playwright install chromium

      - name: Controlla sintassi Python
        run: python -m py_compile update.py update_legacy.py

      - name: Esegui aggiornamento di prova e controlli qualità
        run: python update.py

  update:
    name: Aggiorna e pubblica data.json
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installa dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Chromium Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Installa Chromium
        timeout-minutes: 5
        run: python -m playwright install chromium

      - name: Sincronizza main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      - name: Controlla sintassi Python
        run: python -m py_compile update.py update_legacy.py

      - name: Aggiorna e valida calendario
        run: python update.py

      - name: Pubblica data aggiornata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati."
            exit 0
          fi
          git commit -m "Aggiornamento automatico calendario"
          for attempt in 1 2 3; do
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              echo "main è cambiato durante l'aggiornamento: riallineo e riprovo."
              git reset --hard origin/main
              python update.py
              git add data.json
              if git diff --cached --quiet; then
                echo "Nessuna modifica dopo il riallineamento."
                exit 0
              fi
              git commit -m "Aggiornamento automatico calendario"
            fi
            sleep 2
          done
          echo "Impossibile pubblicare dopo 3 tentativi."
          exit 1
