name: Aggiornamento Basket TV

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"
      timezone: "Europe/Rome"
    - cron: "0 23 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      - name: Aggiorna calendari
        run: python update.py
      - name: Pubblica data.json
        run: |
          git config user.name "basket-tv-bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Aggiorna programmazione Basket TV"
          git push
