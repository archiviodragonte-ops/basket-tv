<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087443">
<meta name="mobile-web-app-capable" content="yes">
<title>Basket TV</title>
<style>
:root{--g:#087443;--d:#10251d;--bg:#f3f5f4;--line:#dfe5e2;--muted:#68736e}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--d)}
header{position:sticky;top:0;z-index:10;background:var(--g);color:#fff;padding:12px;box-shadow:0 2px 10px #0002}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.title{font-size:24px;font-weight:900}.sub{font-size:12px;opacity:.9}
.today{border:0;border-radius:10px;padding:9px 11px;font-weight:900;background:#fff;color:var(--g)}
.days{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.days::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
.day{min-width:66px;border:1px solid #ffffff55;background:#ffffff12;color:#fff;border-radius:11px;padding:8px 5px;text-align:center;font-weight:800}.day b{display:block;font-size:12px}.day span{font-size:18px}.day.active{background:#fff;color:var(--g)}
.filters{display:flex;gap:7px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}
.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800}.filter.active{background:var(--d);color:#fff}
main{max-width:760px;margin:auto;padding:12px}.dateTitle{font-size:20px;font-weight:900}.status{font-size:12px;color:var(--muted);margin:6px 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;margin:9px 0;padding:13px;box-shadow:0 2px 7px #00000009}
.time{font-size:20px;font-weight:900}.comp{font-size:12px;font-weight:850;color:var(--g)}.teams{font-size:17px;font-weight:800;margin:10px 0}.watch{font-size:13px;background:#eef5f1;border-radius:9px;padding:8px}
.empty{text-align:center;padding:45px 15px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}
.note{text-align:center;color:var(--muted);font-size:11px;padding:20px 10px 40px}
</style>
</head>
<body>
<header>
<div class="top"><div><div class="title">🏀 Basket TV</div><div class="sub">Programmazione basket Italia + Europa</div></div><button class="today" id="today">OGGI</button></div>
<div class="days" id="days"></div>
</header>
<nav class="filters" id="filters"></nav>
<main><div class="dateTitle" id="dateTitle"></div><div class="status" id="status">Caricamento…</div><div id="games"></div></main>
<script>
const COMP=[["ALL","TUTTO"],["LBA","LBA"],["A2","A2"],["B","B"],["EUROLEAGUE","EUROLEAGUE"],["EUROCUP","EUROCUP"]];
const W=["DOM","LUN","MAR","MER","GIO","VEN","SAB"];
let data={games:[]},selected=new Date(),filter="ALL";
const $=s=>document.querySelector(s);
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function buildDays(){const b=$("#days");b.innerHTML="";for(let i=-3;i<25;i++){const d=new Date(selected);d.setDate(d.getDate()+i);const x=document.createElement("button");x.className="day"+(!i?" active":"");x.innerHTML=`<b>${W[d.getDay()]}</b><span>${d.getDate()}</span>`;x.onclick=()=>{selected=d;render()};b.appendChild(x)}}
function buildFilters(){const b=$("#filters");b.innerHTML="";COMP.forEach(([k,l])=>{const x=document.createElement("button");x.className="filter"+(k===filter?" active":"");x.textContent=l;x.onclick=()=>{filter=k;render()};b.appendChild(x)})}
function render(){
 buildDays();buildFilters();
 $("#dateTitle").textContent=selected.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
 let gs=(data.games||[]).filter(g=>g.date===iso(selected)&&(filter==="ALL"||g.competition===filter));
 gs.sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));
 $("#status").textContent=data.updated_at?`Dati aggiornati: ${new Date(data.updated_at).toLocaleString("it-IT")}`:"Dati non disponibili";
 $("#games").innerHTML=gs.length?gs.map(g=>`<article class="card"><div class="time">${g.time||"ORARIO DA DEFINIRE"}</div><div class="comp">${g.competition_label||g.competition}</div><div class="teams">${g.home} – ${g.away}</div><div class="watch">📺 ${g.watch||"TV da definire"}</div></article>`).join(""):`<div class="empty">Nessuna partita disponibile per questa data.<br><br>Puoi continuare a scorrere i giorni.</div>`;
}
async function load(){
 const r=await fetch("data.json?ts="+Date.now(),{cache:"no-store"});
 if(!r.ok)throw Error();
 data=await r.json();render();
}
$("#today").onclick=()=>{selected=new Date();load()};
load().catch(()=>{$("#status").textContent="Errore nel caricamento dei dati";});
</script>
</body></html>
