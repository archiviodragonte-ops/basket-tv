<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087443"><title>Basket TV</title><style>:root{--g:#087443;--d:#10251d;--bg:#f3f5f4;--l:#dfe5e2}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--d)}header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:12px;box-shadow:0 2px 10px #0002}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:24px;font-weight:900}.sub{font-size:12px;opacity:.85}button{font:inherit}.today{border:0;border-radius:10px;padding:8px 10px;color:var(--g);font-weight:900}.days,.filters{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.days::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}.days{padding-top:10px}.day{min-width:65px;border:1px solid #fff5;background:#ffffff14;color:#fff;border-radius:11px;padding:7px 4px;text-align:center}.day b{display:block;font-size:11px}.day span{font-size:18px;font-weight:900}.day.active{background:#fff;color:var(--g)}.filters{background:#fff;padding:10px 12px;border-bottom:1px solid var(--l)}.filter{white-space:nowrap;border:1px solid var(--l);background:#fff;border-radius:999px;padding:7px 12px;font-weight:800}.filter.active{background:var(--d);color:#fff}main{max-width:760px;margin:auto;padding:12px}.date{font-size:20px;font-weight:900;margin:5px 0 10px}.status{font-size:12px;color:#6d7773;margin-bottom:10px}.card,.empty,.err{background:#fff;border:1px solid var(--l);border-radius:15px;padding:13px;margin:9px 0}.time{font-size:20px;font-weight:900}.comp{font-size:12px;color:var(--g);font-weight:900}.teams{font-size:17px;font-weight:800;margin:9px 0}.watch{font-size:13px;background:#eef5f1;border-radius:9px;padding:8px}.empty{text-align:center;padding:40px 12px;color:#6d7773}.err{color:#8d2b22;background:#fff1f0}footer{text-align:center;color:#6d7773;font-size:11px;padding:25px}</style></head><body><header><div class="top"><div><div class="title">🏀 Basket TV</div><div class="sub">Programmazione basket Italia + Europa</div></div><button class="today" id="today">OGGI</button></div><div id="days" class="days"></div></header><nav id="filters" class="filters"></nav><main><div id="date" class="date"></div><div id="status" class="status">Caricamento…</div><div id="games"></div></main><footer>Basket TV · dati aggiornati automaticamente</footer><script>const F=[['ALL','TUTTO'],['LBA','LBA'],['A2','A2'],['B','B'],['EUROLEAGUE','EUROLEAGUE'],['EUROCUP','EUROCUP']],W=['DOM','LUN','MAR','MER','GIO','VEN','SAB'];let D={games:[],updated_at:null},sel=new Date(),fil='ALL';const $=s=>document.querySelector(s),iso=d=>d.toISOString().slice(0,10);function render(){let b=$('#days');b.innerHTML='';for(let i=-4;i<25;i++){let d=new Date(sel);d.setDate(d.getDate()+i);let x=document.createElement('button');x.className='day'+(i===0?' active':'');x.innerHTML='<b>'+W[d.getDay()]+'</b><span>'+d.getDate()+'</span>';x.onclick=()=>{sel=d;render()};b.appendChild(x)}$('#date').textContent=sel.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});let fb=$('#filters');fb.innerHTML='';F.forEach(([k,l])=>{let x=document.createElement('button');x.className='filter'+(fil===k?' active':'');x.textContent=l;x.onclick=()=>{fil=k;render()};fb.appendChild(x)});let gs=(D.games||[]).filter(g=>g.date===iso(sel)&&(fil==='ALL'||g.competition===fil)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));$('#status').textContent=D.updated_at?'Dati aggiornati: '+new Date(D.updated_at).toLocaleString('it-IT'):'Dati non disponibili';$('#games').innerHTML=gs.length?gs.map(g=>'<article class="card"><div class="time">'+(g.time||'ORARIO N/D')+'</div><div class="comp">'+(g.competition_label||g.competition)+'</div><div class="teams">'+g.home+' – '+g.away+'</div><div class="watch">📺 '+(g.watch||'Programmazione TV da definire')+'</div></article>').join(''):'<div class="empty">Nessuna partita disponibile per questa data.<br><br>Puoi continuare a scorrere i giorni.</div>'}$('#today').onclick=()=>{sel=new Date();render()};fetch('data.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(x=>{D=x;render()}).catch(()=>{$('#status').textContent='Errore';$('#games').innerHTML='<div class="err">Impossibile caricare i dati.</div>'});</script></body></html>
